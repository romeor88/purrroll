[build]
  command = "pnpm --filter @workspace/purrroll run build"
  publish = "artifacts/purrroll/dist/public"
  functions = "artifacts/purrroll/netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "10.26.1"
  BASE_PATH = "/"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

